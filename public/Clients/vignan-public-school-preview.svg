      <stop offset="0%" stop-color="#091428" />
      <stop offset="50%" stop-color="#0f224a" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>
    <linearGradient id="blue_accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="vpsCard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.08)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg_vps)" />
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0 50h800M0 100h800M0 150h800M0 200h800M0 250h800M0 300h800M0 350h800M0 400h800" />
    <path d="M50 0v450M100 0v450M150 0v450M200 0v450M250 0v450M300 0v450M350 0v450M400 0v450M450 0v450M500 0v450M550 0v450M600 0v450M650 0v450M700 0v450M750 0v450" />
  </g>

  <!-- Ambient Glow -->
