  <path d="M24 64h752" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <circle cx="44" cy="44" r="5" fill="#f43f5e" />
  <circle cx="60" cy="44" r="5" fill="#fbbf24" />
  <circle cx="76" cy="44" r="5" fill="#10b981" />

