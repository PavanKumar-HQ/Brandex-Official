  <text x="60" y="280" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700">Smart Digital Classrooms</text>
  <text x="60" y="302" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="10">High-fidelity 3D interactive STEM learning deployed in every classroom.</text>
  <rect x="60" y="340" width="120" height="24" rx="6" fill="#2563eb" />
