  <text x="304" y="280" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="700">Attendance &amp; Reports</text>
  <text x="304" y="302" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="10">Instant gradebook tracking, fee payments, and circular notifications.</text>
  <rect x="304" y="340" width="120" height="24" rx="6" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
  <text x="320" y="356" fill="#cbd5e1" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="700">Login Portal</text>

  <rect x="532" y="226" width="224" height="176" rx="10" fill="url(#vpsCard)" stroke="rgba(37,99,235,0.3)" stroke-width="1" />
  <text x="548" y="254" fill="#38bdf8" font-family="-apple-system, system-ui, sans-serif" font-size="12" font-weight="800">MEASURABLE LIFT</text>
  <text x="548" y="284" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="24" font-weight="900">+180%</text>
  <text x="548" y="304" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="10">Admission Inquiries Growth</text>
  <text x="548" y="338" fill="#10b981" font-family="-apple-system, system-ui, sans-serif" font-size="14" font-weight="800">100/100 Core Web Vitals</text>
  <text x="548" y="356" fill="#94a3b8" font-family="-apple-system, system-ui, sans-serif" font-size="10">Sub-second performance guarantee</text>
