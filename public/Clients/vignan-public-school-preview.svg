  <!-- Navigation Bar Inside Browser -->
  <text x="44" y="96" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="800">Vignan Public School</text>
  <text x="235" y="95" fill="#93c5fd" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600">Bengaluru South Campus</text>
  
  <rect x="580" y="80" width="176" height="24" rx="8" fill="url(#blue_accent)" />
  <text x="596" y="96" fill="#ffffff" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="700">Online Admissions Open</text>

