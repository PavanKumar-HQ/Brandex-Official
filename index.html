<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>Brandex | Next-Gen Digital Solutions for Ambitious Brands</title>
    <link rel="icon" href="/logo_nobg.png" type="image/png" />
    <link rel="apple-touch-icon" href="/logo_nobg.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <meta name="description" content="Brandex empowers businesses with high-performance websites, custom applications, and automated workflows designed to accelerate growth." />
    <meta name="author" content="Brandex Digital" />
    <meta name="keywords" content="web development, business automation, custom software, digital solutions, react, next-gen apps, Brandex, software agency Bangalore, AI automation, UI UX engineering" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="theme-color" content="#4f47e6" />

    <!-- DNS prefetch & font preconnect for Core Web Vitals -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Security headers -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Brandex" />
    <meta property="og:url" content="https://brandex.dev/" />
    <meta property="og:title" content="Brandex | Next-Gen Digital Solutions for Ambitious Brands" />

    <meta property="og:image" content="https://brandex.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@brandexlabs" />
    <meta name="twitter:creator" content="@brandexlabs" />
    <meta name="twitter:url" content="https://brandex.dev/" />
    <meta name="twitter:title" content="Brandex | Next-Gen Digital Solutions for Ambitious Brands" />
    <meta name="twitter:description" content="High-performance websites, custom software, and automated workflows for businesses that want to scale." />
    <meta name="twitter:image" content="https://brandex.dev/og-image.png" />

            "url": "https://brandex.dev/logo_nobg.png",

          "description": "Brandex empowers businesses with high-performance websites, custom applications, and automated workflows designed to accelerate growth.",

            "@type": "PostalAddress",

            "addressRegion": "Karnataka",
            "addressCountry": "IN"
          },
          "contactPoint": {
            "@type": "ContactPoint",
            "contactType": "customer support",
            "email": "brandexhq@gmail.com",

          },

  <body class="bg-background text-foreground antialiased selection:bg-indigo-500/20 selection:text-indigo-900">
